<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<meta name="theme-color" content="#f0f0f5"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="IRIS"/>
<title>IRIS</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Outfit:wght@100;200;300&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{background:#f0f0f5;font-family:'DM Sans',sans-serif;overscroll-behavior:none;}
  input,select{font-family:'DM Sans',sans-serif;}
  input:focus,select:focus{outline:2px solid #6366f1;outline-offset:0;}
  ::-webkit-scrollbar{display:none;}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useRef } = React;

const defaultProfile = {
  name: "Ashwani Singh",
  photo: null,
  degree: "M Tech",
  year: "1st Year",
  semester: "2nd Semester",
  department: "Chemical Engineering",
  credits: "7.76",
  creditsType: "Major",
  hostelName: "Vindhya (Block III)",
  roomNumber: "116",
  courses: [
    { code: "CH732", name: "Air Pollution Control & Design of Equipment", attendance: 82 },
    { code: "CH734", name: "Mathematical Modelling Environmental Systems", attendance: 74 },
  ],
  announcements: [
    { tag: "IRIS Information", text: "Notice: Mess Closure Requests" },
    { tag: "Academic", text: "Mid-semester exam schedule released" },
  ],
};

const C = {
  pageBg:"#f0f0f5", cardBg:"#ffffff", border:"#e4e4ec",
  accent:"#6366f1", accentFab:"#7c6af7",
  textPri:"#111827", textSec:"#6b7280",
  orange:"#f97316", red:"#ef4444",
};

function AttendanceBar({ value }) {
  const pct = Math.min(Math.max(Number(value)||0,0),100);
  const color = pct >= 75 ? C.orange : C.red;
  return (
    <div style={{marginTop:8}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:5}}>
        <span style={{fontSize:13,color:C.textSec}}>Attendance:</span>
        <span style={{fontSize:13,fontWeight:700,color}}>{pct}%</span>
      </div>
      <div style={{height:5,borderRadius:9999,background:"#e9e9f0",overflow:"hidden"}}>
        <div style={{height:"100%",width:`${pct}%`,background:color,borderRadius:9999,transition:"width 0.5s ease"}}/>
      </div>
    </div>
  );
}

/* ── Photo Lightbox ── */
function Lightbox({ src, initials, onClose }) {
  return (
    <div
      onClick={onClose}
      style={{
        position:"fixed",inset:0,zIndex:300,
        background:"rgba(0,0,0,0.88)",
        display:"flex",alignItems:"center",justifyContent:"center",
      }}
    >
      {src
        ? <img
            src={src} alt="profile enlarged"
            style={{
              width:"82vw",height:"82vw",maxWidth:320,maxHeight:320,
              borderRadius:"50%",objectFit:"cover",
              border:"4px solid #fff",
              boxShadow:"0 0 60px rgba(255,255,255,0.15)",
            }}
          />
        : <div style={{
            width:"72vw",height:"72vw",maxWidth:280,maxHeight:280,
            borderRadius:"50%",background:"#d1d5f5",
            display:"flex",alignItems:"center",justifyContent:"center",
            fontSize:72,fontWeight:700,color:C.accent,
            border:"4px solid #fff",
          }}>{initials}</div>
      }
      <div style={{position:"absolute",top:24,right:24,color:"#fff",fontSize:32,cursor:"pointer",lineHeight:1}}>×</div>
    </div>
  );
}

/* ── Bottom-sheet modal ── */
function Modal({ title, onClose, children }) {
  return (
    <div style={{position:"fixed",inset:0,zIndex:200,background:"rgba(0,0,0,0.45)",display:"flex",alignItems:"flex-end",justifyContent:"center"}} onClick={onClose}>
      <div onClick={e=>e.stopPropagation()} style={{background:"#fff",borderRadius:"22px 22px 0 0",padding:"24px 20px 44px",width:"100%",maxWidth:430,maxHeight:"88vh",overflowY:"auto"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
          <span style={{fontSize:17,fontWeight:700,color:C.textPri}}>{title}</span>
          <button onClick={onClose} style={{background:"#f3f4f6",border:"none",color:C.textSec,borderRadius:"50%",width:32,height:32,cursor:"pointer",fontSize:20,display:"flex",alignItems:"center",justifyContent:"center"}}>×</button>
        </div>
        {children}
      </div>
    </div>
  );
}

function Field({ label, value, onChange, options }) {
  const base = {width:"100%",background:"#f9fafb",border:`1px solid ${C.border}`,borderRadius:10,color:C.textPri,padding:"10px 14px",fontSize:15,fontFamily:"'DM Sans',sans-serif",outline:"none",boxSizing:"border-box",appearance:"none",WebkitAppearance:"none"};
  return (
    <div style={{marginBottom:14}}>
      <label style={{fontSize:11,color:C.textSec,display:"block",marginBottom:5,textTransform:"uppercase",letterSpacing:"0.06em",fontWeight:600}}>{label}</label>
      {options
        ? <select value={value} onChange={e=>onChange(e.target.value)} style={base}>{options.map(o=><option key={o} value={o}>{o}</option>)}</select>
        : <input value={value} onChange={e=>onChange(e.target.value)} style={base}/>
      }
    </div>
  );
}

function SectionHead({ label, onEdit }) {
  return (
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
      <span style={{fontSize:20,fontWeight:800,color:C.textPri,letterSpacing:"-0.02em"}}>{label}</span>
      {onEdit && <button onClick={onEdit} style={{background:"#ededfc",border:"none",color:C.accent,borderRadius:20,padding:"4px 14px",fontSize:12,fontWeight:600,cursor:"pointer"}}>Edit</button>}
    </div>
  );
}

function Card({ children, style={} }) {
  return <div style={{background:C.cardBg,borderRadius:18,padding:"16px",border:`1px solid ${C.border}`,...style}}>{children}</div>;
}

function App() {
  const [profile, setProfile] = useState(defaultProfile);
  const [editModal, setEditModal] = useState(null);
  const [lightbox, setLightbox] = useState(false);
  const [draft, setDraft] = useState({});
  const [activeTab, setActiveTab] = useState("home");
  const fileRef = useRef();

  const set = key => val => setDraft(d=>({...d,[key]:val}));
  const openEdit = section => { setDraft({...profile}); setEditModal(section); };
  const saveEdit = () => { setProfile({...draft}); setEditModal(null); };

  const handlePhoto = e => {
    const file = e.target.files[0];
    if (!file) return;
    const r = new FileReader();
    r.onload = ev => {
      const src = ev.target.result;
      setProfile(p=>({...p,photo:src}));
      setDraft(d=>({...d,photo:src}));
    };
    r.readAsDataURL(file);
  };

  const initials = profile.name.split(" ").map(n=>n[0]).join("").slice(0,2).toUpperCase();

  return (
    <div style={{minHeight:"100vh",background:C.pageBg,fontFamily:"'DM Sans',sans-serif",maxWidth:430,margin:"0 auto",position:"relative",paddingBottom:90}}>

      {/* ── Top bar with correct iris logo ── */}
      <div style={{background:C.pageBg,padding:"18px 20px 0",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        {/*
          Font: Outfit weight 200 (ultralight), wide letter-spacing, all lowercase
          This matches the thin spaced-out iris logo in the reference image
        */}
        <span style={{
          fontSize:32,
          fontWeight:200,
          color:C.textPri,
          fontFamily:"'Outfit',sans-serif",
          letterSpacing:"0.22em",
          lineHeight:1,
        }}>iris</span>

        <div style={{position:"relative",cursor:"pointer"}}>
          <svg width="26" height="26" fill="none" stroke={C.accent} strokeWidth="1.7" viewBox="0 0 24 24">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>
          <div style={{position:"absolute",top:0,right:0,width:9,height:9,borderRadius:"50%",background:"#ef4444",border:`2px solid ${C.pageBg}`}}/>
        </div>
      </div>

      <div style={{padding:"20px 14px 0"}}>

        {/* ── Profile ── */}
        <div style={{marginBottom:22}}>
          <SectionHead label="Profile" onEdit={()=>openEdit("profile")}/>
          <Card>
            <div style={{display:"flex",alignItems:"center",gap:14}}>
              {/* Tappable avatar — opens lightbox */}
              <div style={{position:"relative",flexShrink:0}}>
                <div
                  onClick={()=>setLightbox(true)}
                  style={{cursor:"pointer",position:"relative"}}
                  title="Tap to enlarge"
                >
                  {profile.photo
                    ? <img src={profile.photo} alt="avatar" style={{width:76,height:76,borderRadius:"50%",objectFit:"cover",border:`2px solid ${C.border}`,display:"block"}}/>
                    : <div style={{width:76,height:76,borderRadius:"50%",background:"#d1d5f5",display:"flex",alignItems:"center",justifyContent:"center",fontSize:26,fontWeight:700,color:C.accent}}>{initials}</div>
                  }
                  {/* enlarge hint overlay */}
                  <div style={{
                    position:"absolute",inset:0,borderRadius:"50%",
                    background:"rgba(0,0,0,0.18)",
                    display:"flex",alignItems:"center",justifyContent:"center",
                    opacity:0,transition:"opacity 0.2s",
                  }}
                    onMouseEnter={e=>e.currentTarget.style.opacity=1}
                    onMouseLeave={e=>e.currentTarget.style.opacity=0}
                  >
                    <svg width="20" height="20" fill="none" stroke="#fff" strokeWidth="2.5" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
                  </div>
                </div>
                {/* camera button */}
                <button
                  onClick={()=>fileRef.current.click()}
                  style={{position:"absolute",bottom:1,right:1,background:C.accent,border:"none",borderRadius:"50%",width:22,height:22,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}
                >
                  <svg width="11" height="11" fill="none" stroke="#fff" strokeWidth="2.5" viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
                </button>
                <input ref={fileRef} type="file" accept="image/*" onChange={handlePhoto} style={{display:"none"}}/>
              </div>

              <div style={{flex:1}}>
                <div style={{fontSize:17,fontWeight:800,color:C.textPri,marginBottom:3}}>{profile.name}</div>
                <div style={{fontSize:13,color:C.textSec,marginBottom:2}}>{profile.degree}, {profile.year}, {profile.semester}</div>
                <div style={{fontSize:13,fontWeight:600,color:C.textPri}}>{profile.department}</div>
              </div>
              <svg width="18" height="18" fill="none" stroke={C.accent} strokeWidth="2.5" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
            </div>
          </Card>
        </div>

        {/* ── Dashboard ── */}
        <div style={{marginBottom:22}}>
          <SectionHead label="Dashboard" onEdit={()=>openEdit("dashboard")}/>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
            <Card>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10}}>
                <div style={{display:"flex",alignItems:"center",gap:5}}>
                  <span style={{fontSize:14,fontWeight:700,color:C.accent}}>Credits</span>
                  <svg width="15" height="15" fill="none" stroke={C.accent} strokeWidth="1.8" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
                </div>
                <svg width="16" height="16" fill="none" stroke={C.textSec} strokeWidth="2" viewBox="0 0 24 24"><path d="M21 12H3M21 6H3M15 18H3"/></svg>
              </div>
              <div style={{fontSize:30,fontWeight:800,color:C.textPri,lineHeight:1}}>{profile.credits}</div>
              <div style={{fontSize:12,color:C.textSec,marginTop:4}}>{profile.creditsType}</div>
            </Card>
            <Card>
              <div style={{display:"flex",alignItems:"center",gap:5,marginBottom:10}}>
                <span style={{fontSize:14,fontWeight:700,color:C.accent}}>Hostel</span>
                <svg width="15" height="15" fill="none" stroke={C.accent} strokeWidth="1.8" viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
              </div>
              <div style={{fontSize:15,fontWeight:800,color:C.textPri,lineHeight:1.3}}>{profile.hostelName}</div>
              <div style={{fontSize:12,color:C.textSec,marginTop:4}}>Room Number {profile.roomNumber}</div>
            </Card>
          </div>
        </div>

        {/* ── Courses ── */}
        <div style={{marginBottom:22}}>
          <SectionHead label="Courses" onEdit={()=>openEdit("courses")}/>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
            {profile.courses.map((c,i)=>(
              <Card key={i} style={{padding:"14px"}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
                  <span style={{fontSize:13,fontWeight:700,color:C.accent}}>{c.code}</span>
                  <div style={{display:"flex",gap:4}}>
                    <div style={{width:20,height:20,borderRadius:5,background:"#ff7c00",display:"flex",alignItems:"center",justifyContent:"center"}}><span style={{fontSize:10,fontWeight:800,color:"#fff"}}>m</span></div>
                    <div style={{width:20,height:20,borderRadius:5,background:"#5059c9",display:"flex",alignItems:"center",justifyContent:"center"}}><span style={{fontSize:9,fontWeight:800,color:"#fff"}}>T</span></div>
                  </div>
                </div>
                <div style={{fontSize:13,color:C.textPri,fontWeight:600,lineHeight:1.4,minHeight:44}}>{c.name}</div>
                <AttendanceBar value={c.attendance}/>
              </Card>
            ))}
          </div>
        </div>

        {/* ── Favorite Screens ── */}
        <div style={{marginBottom:22}}>
          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12}}>
            <span style={{fontSize:20,fontWeight:800,color:C.textPri,letterSpacing:"-0.02em"}}>Favorite Screens</span>
            <svg width="20" height="20" viewBox="0 0 24 24" fill={C.textPri}><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          </div>
          <div style={{background:"#f7f7fc",borderRadius:16,padding:"22px 16px",border:`1.5px dashed ${C.border}`,textAlign:"center",cursor:"pointer"}}>
            <span style={{fontSize:15,fontWeight:700,color:C.textPri}}>Add Favorite Screens </span>
            <span style={{fontSize:17,color:C.accent,fontWeight:700}}>+</span>
          </div>
        </div>

        {/* ── Announcements ── */}
        <div style={{marginBottom:22}}>
          <SectionHead label="Announcements"/>
          {profile.announcements.map((a,i)=>(
            <Card key={i} style={{marginBottom:10}}>
              <div style={{fontSize:12,color:C.accent,fontWeight:700,marginBottom:4}}>{a.tag}</div>
              <div style={{fontSize:14,color:C.textPri,fontWeight:500}}>{a.text}</div>
            </Card>
          ))}
        </div>

      </div>

      {/* ── Bottom Nav ── */}
      <div style={{position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:430,background:"#fff",borderTop:`1px solid ${C.border}`,display:"flex",justifyContent:"space-around",alignItems:"center",padding:"10px 0 22px"}}>
        {[
          {id:"home",label:"Home"},
          {id:"categories",label:"Categories"},
          {id:"more",label:"More"},
        ].map(tab=>{
          const active=activeTab===tab.id;
          return (
            <button key={tab.id} onClick={()=>setActiveTab(tab.id)} style={{background:"none",border:"none",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:3,padding:"0 22px"}}>
              {tab.id==="home" && (active
                ? <svg width="24" height="24" viewBox="0 0 24 24" fill={C.accent}><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><rect x="9" y="12" width="6" height="10" fill="#fff"/></svg>
                : <svg width="24" height="24" fill="none" stroke={C.textSec} strokeWidth="2" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
              )}
              {tab.id==="categories" && <svg width="24" height="24" fill="none" stroke={active?C.accent:C.textSec} strokeWidth="2" viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg>}
              {tab.id==="more" && <svg width="24" height="24" fill="none" stroke={active?C.accent:C.textSec} strokeWidth="2" viewBox="0 0 24 24"><line x1="21" y1="6" x2="3" y2="6"/><line x1="21" y1="12" x2="3" y2="12"/><line x1="15" y1="18" x2="3" y2="18"/></svg>}
              <span style={{fontSize:11,color:active?C.accent:C.textSec,fontWeight:active?700:400}}>{tab.label}</span>
            </button>
          );
        })}
      </div>

      {/* ── Chat FAB ── */}
      <div style={{position:"fixed",bottom:82,right:"max(14px, calc(50% - 201px))",background:C.accentFab,borderRadius:16,width:54,height:54,display:"flex",alignItems:"center",justifyContent:"center",boxShadow:"0 6px 24px rgba(124,106,247,0.35)",cursor:"pointer"}}>
        <svg width="22" height="22" fill="none" stroke="#fff" strokeWidth="2.2" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      </div>

      {/* ── Lightbox ── */}
      {lightbox && <Lightbox src={profile.photo} initials={initials} onClose={()=>setLightbox(false)}/>}

      {/* ══ MODALS ══ */}

      {editModal==="profile" && (
        <Modal title="Edit Profile" onClose={()=>setEditModal(null)}>
          <div style={{display:"flex",flexDirection:"column",alignItems:"center",marginBottom:20}}>
            <div style={{position:"relative",marginBottom:8}}>
              {draft.photo
                ? <img src={draft.photo} alt="avatar" style={{width:90,height:90,borderRadius:"50%",objectFit:"cover",border:`3px solid ${C.accent}`}}/>
                : <div style={{width:90,height:90,borderRadius:"50%",background:"#d1d5f5",display:"flex",alignItems:"center",justifyContent:"center",fontSize:30,fontWeight:700,color:C.accent,border:`3px solid ${C.accent}`}}>{(draft.name||"").split(" ").map(n=>n[0]).join("").slice(0,2).toUpperCase()}</div>
              }
              <button onClick={()=>fileRef.current.click()} style={{position:"absolute",bottom:2,right:2,background:C.accent,border:"none",borderRadius:"50%",width:28,height:28,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>
                <svg width="13" height="13" fill="none" stroke="#fff" strokeWidth="2.5" viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
              </button>
            </div>
            <span style={{fontSize:12,color:C.textSec}}>Tap camera icon to change photo</span>
          </div>
          <Field label="Full Name"  value={draft.name}       onChange={set("name")}/>
          <Field label="Degree"     value={draft.degree}     onChange={set("degree")}     options={["B Tech","M Tech","PhD","MBA","MSc","BSc"]}/>
          <Field label="Year"       value={draft.year}       onChange={set("year")}       options={["1st Year","2nd Year","3rd Year","4th Year","5th Year"]}/>
          <Field label="Semester"   value={draft.semester}   onChange={set("semester")}   options={["1st Semester","2nd Semester"]}/>
          <Field label="Department" value={draft.department} onChange={set("department")}/>
          <button onClick={saveEdit} style={{width:"100%",background:C.accent,border:"none",borderRadius:14,color:"#fff",padding:"14px",fontSize:16,fontWeight:700,cursor:"pointer",marginTop:8}}>Save Changes</button>
        </Modal>
      )}

      {editModal==="dashboard" && (
        <Modal title="Edit Dashboard" onClose={()=>setEditModal(null)}>
          <Field label="Credits / CGPA" value={draft.credits}     onChange={set("credits")}/>
          <Field label="Type"           value={draft.creditsType} onChange={set("creditsType")} options={["Major","Cumulative","Semester"]}/>
          <Field label="Hostel Name"    value={draft.hostelName}  onChange={set("hostelName")}/>
          <Field label="Room Number"    value={draft.roomNumber}  onChange={set("roomNumber")}/>
          <button onClick={saveEdit} style={{width:"100%",background:C.accent,border:"none",borderRadius:14,color:"#fff",padding:"14px",fontSize:16,fontWeight:700,cursor:"pointer",marginTop:8}}>Save Changes</button>
        </Modal>
      )}

      {editModal==="courses" && (
        <Modal title="Edit Courses" onClose={()=>setEditModal(null)}>
          {draft.courses?.map((course,i)=>(
            <div key={i} style={{background:"#f9fafb",borderRadius:14,padding:14,marginBottom:14,border:`1px solid ${C.border}`}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
                <span style={{fontSize:13,color:C.accent,fontWeight:700}}>Course {i+1}</span>
                {draft.courses.length>1 && <button onClick={()=>setDraft(d=>({...d,courses:d.courses.filter((_,j)=>j!==i)}))} style={{background:"none",border:"none",color:C.red,fontSize:12,cursor:"pointer",fontWeight:600}}>Remove</button>}
              </div>
              <Field label="Course Code"  value={course.code}            onChange={val=>{const u=[...draft.courses];u[i]={...u[i],code:val};setDraft(d=>({...d,courses:u}));}}/>
              <Field label="Course Name"  value={course.name}            onChange={val=>{const u=[...draft.courses];u[i]={...u[i],name:val};setDraft(d=>({...d,courses:u}));}}/>
              <Field label="Attendance %" value={String(course.attendance)} onChange={val=>{const u=[...draft.courses];u[i]={...u[i],attendance:Number(val)};setDraft(d=>({...d,courses:u}));}}/>
            </div>
          ))}
          <button onClick={()=>setDraft(d=>({...d,courses:[...d.courses,{code:"NEW",name:"New Course",attendance:0}]}))} style={{width:"100%",background:"transparent",border:`1.5px dashed ${C.border}`,borderRadius:14,color:C.textSec,padding:"12px",fontSize:14,cursor:"pointer",marginBottom:12}}>+ Add Course</button>
          <button onClick={saveEdit} style={{width:"100%",background:C.accent,border:"none",borderRadius:14,color:"#fff",padding:"14px",fontSize:16,fontWeight:700,cursor:"pointer"}}>Save Changes</button>
        </Modal>
      )}

    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>
</body>
</html>
